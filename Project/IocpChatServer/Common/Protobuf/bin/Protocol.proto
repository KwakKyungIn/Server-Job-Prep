syntax = "proto3";
package Protocol;
import "Struct.proto";
import "Enum.proto";

// ===== 로그인 / 연결 =====
message C_LOGIN_REQ {
    string name = 1;
}
message S_LOGIN_RES {
    int64 playerId = 1;
    ConnectStatus status = 2;
    string reason = 3;
}

// Reconnect
message C_RECONNECT_REQ {
    int64 playerId = 1;
    int64 lastReceivedMessageId = 2; // 클라가 마지막으로 받은 메시지 ID
}
message S_RECONNECT_RES {
    bool success = 1;
    repeated PendingMessage pending = 2;
    string reason = 3;
}

// ===== 1:1 채팅 =====
message C_PRIVATE_CHAT_REQ {
    int64 targetId = 1;
    string message = 2;
}
message S_PRIVATE_CHAT_NTF {
    ChatMessage chat = 1;
}

// ===== 채팅 룸 =====
message C_CREATE_ROOM_REQ {
    string roomName = 1;
    RoomType type = 2;
}
message S_CREATE_ROOM_RES {
    bool success = 1;
    RoomInfo room = 2;
    string reason = 3;
}

message C_JOIN_ROOM_REQ {
    int64 roomId = 1;
}
message S_JOIN_ROOM_RES {
    bool success = 1;
    RoomInfo room = 2;
    string reason = 3;
}

message C_ROOM_CHAT_REQ {
    int64 roomId = 1;
    string message = 2;
}
message S_ROOM_CHAT_NTF {
    int64 roomId = 1;
    ChatMessage chat = 2;
}

// ===== 친구 =====
message C_FRIEND_ADD_REQ {
    int64 targetId = 1;
}
message S_FRIEND_ADD_RES {
    bool success = 1;
    FriendInfo friend = 2;
    string reason = 3;
}

message C_FRIEND_LIST_REQ {}
message S_FRIEND_LIST_RES {
    repeated FriendInfo friends = 1;
}

// ===== Presence =====
message S_PRESENCE_NTF {
    int64 playerId = 1;
    PresenceStatus status = 2;
}

// ===== Flooding 방지 =====
message S_RATE_LIMIT_NTF {
    int64 playerId = 1;
    int32 cooldownSec = 2;
    string reason = 3;
}

// ===== 운영자 명령어 =====
message C_ADMIN_COMMAND_REQ {
    string command = 1;   // "/kick 123", "/mute 456", "/announce Hello"
}
message S_ADMIN_COMMAND_RES {
    AdminActionResult result = 1;
    string output = 2;    // 실행 결과 메시지
}
