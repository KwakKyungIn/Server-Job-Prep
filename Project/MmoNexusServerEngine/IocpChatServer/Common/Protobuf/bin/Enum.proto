syntax = "proto3";
package Protocol;

// ===== [Game Logic] 플레이어 행동 상태 =====
enum MoveState {
    MOVE_IDLE = 0;    // 정지
    MOVE_RUN = 1;     // 달리기
    MOVE_JUMP = 2;    // 점프
}

// [New] 행동 상태 정의
enum ActionState {
    ACTION_IDLE = 0;   // 아무것도 안 함 (평온)
    ACTION_ATTACK = 1; // 기본 공격
    ACTION_DEAD = 2;   // 사망
    ACTION_SKILL = 3;  // 스킬 사용
    ACTION_HIT = 4;    // 피격 (경직)
}

// ===== [Game Logic] 플레이어 직업 타입 =====
enum PlayerType {
    PLAYER_NONE = 0;
    PLAYER_KNIGHT = 1;
    PLAYER_MAGE = 2;
    PLAYER_ARCHER = 3;
}

enum ObjectType {
  OBJECT_TYPE_NONE = 0;
  OBJECT_TYPE_PLAYER = 1;
  OBJECT_TYPE_MONSTER = 2;
  OBJECT_TYPE_PROJECTILE = 3;
}
// ===== [Item] 아이템 타입 (NEW) =====
enum ItemType {
    ITEM_TYPE_NONE = 0;
    ITEM_TYPE_WEAPON = 1;      // 무기
    ITEM_TYPE_ARMOR = 2;       // 방어구
    ITEM_TYPE_CONSUMABLE = 3;  // 소비 아이템 (포션 등)
}

//======[Skill] 스킬관련=========
enum SkillType {
    SKILL_NONE = 0;
    SKILL_AUTO = 1;       // 평타 (단일 타겟)
    SKILL_PROJECTILE = 2; // 투사체 (화살, 파이어볼)
    SKILL_AREA_CIRCLE = 3; // 원형 범위 (자폭, 주변 광역기)
    SKILL_AREA_CONE = 4;   // 부채꼴 (전방 브레스)
}
// ===== [Network] 연결 상태 =====
enum ConnectStatus {
    CONNECT_OK = 0;
    CONNECT_FAIL = 1;
    CONNECT_RECONNECT = 2;
}

// ===== [Chat] 채팅 룸 타입 =====
enum RoomType {
    ROOM_PRIVATE = 0;   // 1:1
    ROOM_GROUP   = 1;   // 단체방
    ROOM_GUILD   = 2;   // 길드/운영 확장
}

// ===== [Social] Presence 상태 =====
enum PresenceStatus {
    OFFLINE = 0;
    ONLINE = 1;
    IN_GAME = 2;
    AWAY = 3;
}

// ===== [Social] 친구 요청 상태 =====
enum FriendStatus {
    PENDING = 0;
    ACCEPTED = 1;
    BLOCKED = 2;
}

// ===== [Party] 파티 요청 종류 =====
enum PartyOp {
    PARTY_OP_NONE = 0;

    PARTY_OP_CREATE = 100;
    PARTY_OP_INVITE = 101;
    PARTY_OP_INVITE_ACCEPT = 102;
    PARTY_OP_INVITE_REJECT = 103;

    PARTY_OP_LEAVE = 110;
    PARTY_OP_KICK = 111;
    PARTY_OP_DISBAND = 112;

    PARTY_OP_STATUS_REQ = 120; // (선택) 디버그/로깅용
}

// ===== [Party] 실패/거절 사유 =====
enum PartyResultReason {
    PARTY_REASON_NONE = 0;

    PARTY_REASON_OK = 1000;

    PARTY_REASON_NO_TARGET = 1001;         // 대상 없음(오프라인/세션 없음)
    PARTY_REASON_ALREADY_IN_PARTY = 1002;  // 대상 또는 내가 이미 파티 있음
    PARTY_REASON_NOT_IN_PARTY = 1003;      // 파티가 없는데 요청함
    PARTY_REASON_NOT_LEADER = 1004;        // 리더만 가능한 동작
    PARTY_REASON_NOT_MEMBER = 1005;        // 파티원이 아님
    PARTY_REASON_INVALID_PARTY = 1006;     // partyId가 잘못됨
    PARTY_REASON_SELF_TARGET = 1007;       // 자기 자신 초대/추방 등
    PARTY_REASON_FULL = 1008;              // 파티 정원 초과(나중에)
    PARTY_REASON_REJECTED = 1009;          // 초대 거절
    PARTY_REASON_INTERNAL_ERROR = 1099;    // 서버 내부 에러
}
