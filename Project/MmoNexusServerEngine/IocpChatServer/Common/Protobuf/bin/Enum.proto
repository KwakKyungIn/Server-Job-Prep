syntax = "proto3";
package Protocol;

// ===== [Game Logic] 플레이어 행동 상태 =====
enum MoveState {
    MOVE_IDLE = 0;    // 정지
    MOVE_RUN = 1;     // 달리기
    MOVE_JUMP = 2;    // 점프
}

// [New] 행동 상태 정의
enum ActionState {
    ACTION_IDLE = 0;   // 아무것도 안 함 (평온)
    ACTION_ATTACK = 1; // 기본 공격
    ACTION_DEAD = 2;   // 사망
    ACTION_SKILL = 3;  // 스킬 사용
    ACTION_HIT = 4;    // 피격 (경직)
}

// ===== [Game Logic] 플레이어 직업 타입 =====
enum PlayerType {
    PLAYER_NONE = 0;
    PLAYER_KNIGHT = 1;
    PLAYER_MAGE = 2;
    PLAYER_ARCHER = 3;
}

enum ObjectType {
  OBJECT_TYPE_NONE = 0;
  OBJECT_TYPE_PLAYER = 1;
  OBJECT_TYPE_MONSTER = 2;
  OBJECT_TYPE_PROJECTILE = 3;
}
// ===== [Item] 아이템 타입 (NEW) =====
enum ItemType {
    ITEM_TYPE_NONE = 0;
    ITEM_TYPE_WEAPON = 1;      // 무기
    ITEM_TYPE_ARMOR = 2;       // 방어구
    ITEM_TYPE_CONSUMABLE = 3;  // 소비 아이템 (포션 등)
}

// ===== [Network] 연결 상태 =====
enum ConnectStatus {
    CONNECT_OK = 0;
    CONNECT_FAIL = 1;
    CONNECT_RECONNECT = 2;
}

// ===== [Chat] 채팅 룸 타입 =====
enum RoomType {
    ROOM_PRIVATE = 0;   // 1:1
    ROOM_GROUP   = 1;   // 단체방
    ROOM_GUILD   = 2;   // 길드/운영 확장
}

// ===== [Social] Presence 상태 =====
enum PresenceStatus {
    OFFLINE = 0;
    ONLINE = 1;
    IN_GAME = 2;
    AWAY = 3;
}

// ===== [Social] 친구 요청 상태 =====
enum FriendStatus {
    PENDING = 0;
    ACCEPTED = 1;
    BLOCKED = 2;
}