syntax = "proto3";
package Protocol;

import "Enum.proto";

// ===== 공용 위치 정보 =====
message PositionInfo {
    float x = 1;
    float y = 2;
    float z = 3;
    float yaw = 4;       // 바라보는 방향 (Rotation Y)
    MoveState state = 5; // IDLE, RUN, JUMP 등
    ActionState actionState = 6;
}

// ===== 플레이어 정보 (Login, Spawn 시 사용) =====
message PlayerInfo {
    uint64 playerId = 1;
    string name = 2;
    PlayerType type = 3;
    PositionInfo posInfo = 4; // 위치 정보 포함
    StatInfo statInfo = 5;
}

// ==========================몬스터 정보==================================
message MonsterInfo {
  uint64 objectId = 1;      // [New] 서버에서 발급한 고유 ID
  int32 templateId = 2;
  string name = 3;
  PositionInfo posInfo = 4;
  StatInfo statInfo = 5;
}

// ===== [Item] 아이템 정보 구조체 (NEW) =====
message ItemInfo {
    uint64 itemUid = 1;      // DB의 item_uid (BIGINT)
    int32 templateId = 2;    // 아이템 종류 ID (DataSheet ID)
    int32 count = 3;         // 개수
    int32 slot = 4;          // 인벤토리 슬롯 번호
    bool isEquipped = 5;     // 장착 여부
}

message StatInfo {
    int32 level = 1;
    int32 hp = 2;
    int32 maxHp = 3;
    int32 attack = 4;
    int32 defense = 5;
    int32 speed = 6;
    int64 totalExp = 7; // 경험치
}

// ============================================================
// [TEMPLATE DATA] (SHARED)
// 클라: 툴팁 표시용 / 서버: 로직 계산용
// ============================================================

message StatTemplateInfo {
    int32 level = 1;
    int32 maxHp = 2;
    int32 attack = 3;
    int32 defense = 4;
    int32 speed = 5;
    int64 totalExp = 6;
}

message ItemTemplateInfo {
    int32 templateId = 1;
    string name = 2;
    int32 itemType = 3;
    int32 attackBonus = 4;
    int32 defenseBonus = 5;
    int32 hpBonus = 6;
}

//=====스킬 관련========
message SkillTemplateInfo {
    int32 skillId = 1;
    string name = 2;
    int32 cooldown = 3;   // 쿨타임 (ms 단위 추천)
    int32 damage = 4;     // 데미지 계수 (또는 고정 데미지)
    SkillType skillType = 5; // 판정 타입
    
    // [Hitbox Data]
    float range = 6;      // 사거리 (시전 가능 거리)
    float radius = 7;     // 폭발 반경 (원형/부채꼴 반지름)
    float angle = 8;      // 부채꼴 각도 (Cone 타입일 때만 사용)
    
    // 필요하면 이펙트 ID, 애니메이션 이름 등도 추가 가능
    int32 effectId = 9;

    float projectileSpeed = 10;   // units/sec
    int32 projectileLifeMs = 11;  // ms
    float hitRadius = 12;         // 0이면 radius 재활용 가능
    bool stopOnHit = 13;          // DB에서 항상 채워라(기본 true 권장)
    int32 maxHits = 14;           // 기본 1
}

// ===== 방/맵 정보 =====
// 채팅방 개념을 게임 맵 개념으로 확장
message RoomInfo {
    int32 roomId = 1; // 맵 ID or 인스턴스 ID
    repeated PlayerInfo players = 2; // 현재 맵에 있는 유저들
}

// ===== (구) 채팅 메시지 (필요하면 유지) =====
message ChatMessage {
    uint64 senderId = 1;
    string name = 2;
    string message = 3;
}

// Struct.proto (예: MonsterInfo 아래에 추가)

message ProjectileInfo {
  uint64 objectId = 1;      // 서버 발급 objectId (OBJECT_TYPE_PROJECTILE 비트 포함)
  uint64 ownerId  = 2;      // 플레이어면 playerId, 몬스터면 objectId
  int32  skillId  = 3;      // 어떤 스킬에서 나온 투사체인지
  PositionInfo posInfo = 4; // 현재 위치/방향
  float  speed = 5;         // (선택) 클라 보간용/디버그
  uint32 lifeTimeMs = 6;    // (선택) 디버그용
}

message QuickSlotInfo {
    int32 slotIndex = 1;
    QuickSlotRefType refType = 2;
    uint64 refId = 3; // itemUid or skillId
}


// ===== [Trade] =====
message TradeOfferItem {
    uint64 itemUid = 1;
    int32 templateId = 2;
    int32 count = 3;
}