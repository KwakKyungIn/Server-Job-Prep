syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

// ============================================================
// [LOGIN SERVER ONLY]
// ============================================================

// 1. Login Request (Client -> LoginServer)
// Replaces existing C_LOGIN_REQ
message C_LOGIN {
    string userId = 1;
    string password = 2; // (Plain text for now)
}

// 2. Login Response (LoginServer -> Client)
// Replaces existing S_LOGIN_RES
message S_LOGIN {
    bool success = 1;
    repeated ServerInfo serverList = 2; // List of accessible game servers
    string token = 3; // [Core] Issued auth token
}

// 3. Server Info Structure
message ServerInfo {
    string name = 1; // e.g., "Channel 1"
    string ip = 2;   // e.g., "127.0.0.1"
    int32 port = 3;  // e.g., 7777
    int32 congestion = 4; // Congestion level
}

// ============================================================
// [GAME SERVER ONLY]
// ============================================================

// 4. Enter Game Request (Client -> GameServer)
// Replaces existing C_ENTER_GAME_REQ
// PlayerIndex is no longer sent. (Assuming decided by LoginServer or just sending Token)
message C_ENTER_GAME {
    string token    = 1; // [Core] Token instead of ID
    int32  channelId = 2; // [NEW] Channel selected by client
    int32  mapId     = 3; // [NEW] Map to enter (Use 1 if empty/default)
}
// 5. Enter Game Response (GameServer -> Client)
// Replaces existing S_ENTER_GAME_RES
message S_ENTER_GAME {
    bool success = 1;
    PlayerInfo myPlayer = 2; // My character info
}

// ============================================================
// [GAME LOGIC - MOVEMENT] (Kept as is)
// ============================================================
message C_MOVE {

    PositionInfo posInfo = 1;
    uint32 move_seq = 2;
    uint32 client_time_ms = 3;
}

message S_MOVE {
    uint64 objectId = 1;
    PositionInfo posInfo = 2; 
}

// ============================================================
// [GAME LOGIC - VISIBILITY] (Kept as is)
// ============================================================
message S_SPAWN {
  uint32 snapshot_id = 10;
  bool snapshot_begin = 11;
  bool snapshot_end = 12;

  repeated PlayerInfo players = 1;
  repeated MonsterInfo monsters = 2;
  repeated ProjectileInfo projectiles = 3;
}
message S_DESPAWN {
    repeated uint64 objectIds = 1; 
}

// ============================================================
// [COMBAT] (Kept as is)
// ============================================================
message C_SKILL {
    int32 skillId = 1; 
    float castYaw = 2;          
    uint32 client_time_ms = 3;
}

message S_SKILL {
    uint64 objectId = 1; 
    int32 skillId = 2;    
    // Skill cooldown duration in milliseconds (authoritative from server).
    // Client can use this to drive UI cooldown overlay.
    int32 cooldownMs = 3;
}

message S_CHANGE_HP {
    uint64 objectId = 1; 
    uint64 attackerId = 2; 
    int32 currentHp = 3; 
    int32 damage = 4;     
}

// ============================================================
// [ITEM & INVENTORY] (Kept as is)
// ============================================================
message S_ITEM_LIST {
    repeated ItemInfo items = 1;
}

message C_USE_ITEM {
    uint64 itemUid = 1;
}

message S_CHANGE_ITEM {
    ItemInfo item = 1; 
}

message S_REMOVE_ITEM {
    uint64 itemUid = 1;
}

message C_EQUIP_ITEM {
    uint64 itemUid = 1;       
    int32 slotIndex = 2;      
    bool equip = 3;           
}

message S_EQUIP_ITEM {
    uint64 itemUid = 1;
    bool equipped = 2;
    int32 slotIndex = 3; 
}

message S_CHANGE_STAT {
    StatInfo statInfo = 1;
}

// ============================================================
// [GAME SERVER ONLY] 
// ============================================================
message C_MAP_CHANGE_REQ {
    int32 targetMapId = 1; 
}
message S_MAP_CHANGE_BEGIN {
    uint64 token = 1; int32 targetMapId = 2; PositionInfo spawn = 3; int64 instanceid = 4;  int32 targetChannelId = 5;
}

message C_MAP_CHANGE_ACK {
    uint64 token = 1; 
}
message S_MAP_CHANGE_END {
    uint64 token = 1; int32 mapId = 2; PositionInfo pos = 3; int64 instanceid = 4; int32 targetChannelId = 5;
}

message C_CHANNEL_CHANGE_REQ {
    int32 targetChannelId = 1;
}




// ============================================================
// [CHAT] (Kept as is)
// ============================================================
message C_CHAT_REQ {
    string message = 1;
}

message S_CHAT_RES {
    bool success = 1; 
}

message S_CHAT_NTF {
    uint64 playerId = 1;
    string name = 2;
    string message = 3;
}

// ============================================================
// [HEARTBEAT] (Kept as is)
// ============================================================
message S_HEART_BEAT_RES { } 
message C_HEART_BEAT_REQ { }

message C_PARTY_CHAT_REQ {
    string message = 1;
}

message S_PARTY_CHAT_NTF {
    uint64 partyId = 1;
    uint64 senderId = 2;
    string senderName = 3;
    string message = 4;
}

message S_PARTY_INFO_NTF {
    bool hasParty = 1;
    uint64 partyId = 2;
    uint64 leaderId = 3;
    repeated uint64 memberIds = 4;
    uint32 version = 5;
}


// ============================================================
// [PARTY - CONTROL] (NEW)
// ============================================================

// Requests for Party Create/Invite/Accept/Reject/Leave/Kick/Disband
// - op/reason enum should be defined in Enum.proto

message C_PARTY_CREATE_REQ {
    uint64 targetPlayerId = 1; // Start party: Target 1 player (If 0, create party alone)
}

message C_PARTY_INVITE_REQ {
    uint64 targetPlayerId = 1;
}

message C_PARTY_INVITE_ACCEPT_REQ {
    uint64 partyId = 1;    // Invited Party ID
    bool accept = 2;       // true=Accept, false=Reject
}

message C_PARTY_LEAVE_REQ { }

message C_PARTY_KICK_REQ {
    uint64 targetPlayerId = 1;
}

message C_PARTY_DISBAND_REQ { }

// Server -> Client: Result (Common)
// op/reason should be defined in Enum.proto (e.g., PartyOp, PartyResultReason)
message S_PARTY_RESULT {
    int32 op = 1;         // PartyOp (enum)
    bool success = 2;
    int32 reason = 3;     // PartyResultReason (enum)
    uint64 partyId = 4;
    uint32 version = 5;
}

// Server -> Client: Party Invite Notification
message S_PARTY_INVITE_NTF {
    uint64 partyId = 1;
    uint64 inviterId = 2;
    string inviterName = 3;
}

// ============================================================
// [PARTY - STATUS] (NEW) Check party member HP/Level etc.
// ============================================================

// Party Member Status (Minimal)
// - Adding objectId makes it easier to find in world (0 if not present)
message PartyMemberStatus {
    uint64 playerId = 1;
    uint64 objectId = 2;
    string name = 3;

    int32 level = 4;
    int32 hp = 5;
    int32 maxHp = 6;

    int32 mapId = 7;
    int32 channelId = 8;
    PositionInfo posInfo = 9; // Can remove if desired (For minimap/tracking)
}

// Client -> Server: Request Party Status Snapshot (Once when UI opens)
message C_PARTY_STATUS_REQ { }

// Server -> Client: Party Status Snapshot/Update
// - memberStatus can be full snapshot or delta (Start with snapshot)
message S_PARTY_STATUS_NTF {
    uint64 partyId = 1;
    uint32 version = 2;
    repeated PartyMemberStatus members = 3;
}


// ===== Dungeon / Instance =====

enum DungeonEnterFailReason {
  DUNGEON_ENTER_OK = 0;
  DUNGEON_ENTER_FAIL_NOT_IN_PARTY = 1;
  DUNGEON_ENTER_FAIL_INVALID_MAP = 2;
  DUNGEON_ENTER_FAIL_INTERNAL = 3;
}

message C_DUNGEON_ENTER_REQ {
  int32 dungeonMapId = 1;
}

message S_DUNGEON_ENTER_RES {
  bool  success = 1;
  int32 dungeonMapId = 2;
  int64 instanceid = 3;          
  DungeonEnterFailReason reason = 4;
}

enum DungeonExitFailReason {
  DUNGEON_EXIT_OK = 0;
  DUNGEON_EXIT_FAIL_NOT_IN_DUNGEON = 1;
  DUNGEON_EXIT_FAIL_NOT_IN_PARTY = 2;
  DUNGEON_EXIT_FAIL_INTERNAL = 3;
}

message C_DUNGEON_EXIT_REQ {
  // empty
}

message S_DUNGEON_EXIT_RES {
  bool  success = 1;
  int32 returnMapId = 2;
  int64 returnInstanceid = 3; 
  DungeonExitFailReason reason = 4;
}

// ============================================================
// [QUICKSLOT] (NEW)
// ============================================================


message S_QUICKSLOT_LIST {
    repeated QuickSlotInfo slots = 1; 
}

message C_SET_QUICKSLOT {
    int32 slotIndex = 1;         
    QuickSlotRefType refType = 2; 
    uint64 refId = 3;            
}

message S_SET_QUICKSLOT {
    bool success = 1;
    QuickSlotInfo slot = 2;
}


// ============================================================
// [TRADE] (NEW)
// ============================================================

message C_TRADE_REQ {
    uint64 targetPlayerId = 1;
}

message S_TRADE_INVITE {
    uint64 fromPlayerId = 1;
    string fromName = 2;
}

message C_TRADE_INVITE_RESP {
    bool accept = 1;
}

message S_TRADE_START {
    uint64 tradeId = 1;
    uint64 peerId = 2;
    string peerName = 3;
}

message C_TRADE_OFFER_SET {
    uint64 tradeId = 1;
    uint64 itemUid = 2;
    int32 count = 3;
}

message S_TRADE_OFFER_UPDATE {
    uint64 tradeId = 1;
    uint64 whoPlayerId = 2;
    repeated TradeOfferItem items = 3;
}

message C_TRADE_READY {
    uint64 tradeId = 1;
    bool ready = 2;
}

message S_TRADE_READY_STATE {
    uint64 tradeId = 1;
    bool aReady = 2;
    bool bReady = 3;
}

message S_TRADE_LOCKED {
    uint64 tradeId = 1;
}

message C_TRADE_CONFIRM {
    uint64 tradeId = 1;
}

message C_TRADE_CANCEL {
    uint64 tradeId = 1;
    TradeCancelReason reason = 2;
}

message S_TRADE_CANCELLED {
    uint64 tradeId = 1;
    TradeCancelReason reason = 2;
}

message S_TRADE_RESULT {
    uint64 tradeId = 1;
    bool success = 2;
    TradeFailCode failCode = 3;
    string msg = 4;
}

message C_INV_DRAG_DROP {
  uint64 itemUid = 1;
  int32  fromSlot = 2;
  int32  toSlot   = 3;
}