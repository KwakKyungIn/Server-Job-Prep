syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

// ============================================================
// [LOGIN]
// ============================================================
message C_LOGIN_REQ {
    string name = 1;
}

message S_LOGIN_RES {
    bool success = 1;
    uint64 playerId = 2;             // [Restore] 기존 코드 호환용 (메인 캐릭터 ID)
    repeated PlayerInfo players = 3; // [New] 계정에 생성된 캐릭터 목록 (캐릭터 선택창용)
}

message C_ENTER_GAME_REQ {
    uint64 playerIndex = 1; // 선택한 캐릭터 인덱스
}

message S_ENTER_GAME_RES {
    bool success = 1;
    PlayerInfo myPlayer = 2; // 내 캐릭터 정보 (좌표 포함)
}

// ============================================================
// [GAME LOGIC - MOVEMENT] (필수!)
// ============================================================
message C_MOVE {
    PositionInfo posInfo = 1; // 내가 이동한 좌표와 상태
}

message S_MOVE {
    uint64 playerId = 1;
    PositionInfo posInfo = 2; // 누가 어디로 갔는지
}

// ============================================================
// [GAME LOGIC - VISIBILITY] (Spawn/Despawn)
// ============================================================
message S_SPAWN {
    repeated PlayerInfo players = 1; // 내 시야에 들어온 플레이어들
}

message S_DESPAWN {
    repeated uint64 playerIds = 1; // 내 시야에서 사라진 플레이어들 (ID만)
}

// ============================================================
// [ITEM & INVENTORY] (NEW SECTION)
// ============================================================

// 1. 인벤토리 전체 로딩 (게임 접속 직후 서버 -> 클라)
message S_ITEM_LIST {
    repeated ItemInfo items = 1;
}

// 2. 아이템 장착/사용 요청 (클라 -> 서버)
// 장비면 장착/해제, 포션이면 사용. 서버가 판단한다.
message C_USE_ITEM {
    uint64 itemUid = 1;
}

// 3. 아이템 정보 갱신 통보 (서버 -> 클라)
// 아이템 획득, 사용(개수 감소), 장착 상태 변경 시 사용
message S_CHANGE_ITEM {
    ItemInfo item = 1; 
}

// 4. 아이템 삭제 통보 (서버 -> 클라)
// 포션을 다 썼거나 아이템을 버렸을 때
message S_REMOVE_ITEM {
    uint64 itemUid = 1;
}

message C_EQUIP_ITEM {
    uint64 itemUid = 1;      // 어떤 아이템을?
    int32 slotIndex = 2;     // 몇 번 슬롯에 있는 거? (검증용)
    bool equip = 3;          // true: 장착, false: 해제
}

message S_EQUIP_ITEM {
    uint64 itemUid = 1;
    bool equipped = 2;
    int32 slotIndex = 3; // [NEW] 몇 번 슬롯인지 알려줌 (UI 갱신용)
}

// [Stat Sync] 스탯 변경 알림 (장비 장착, 레벨업, 버프 등)
message S_CHANGE_STAT {
    StatInfo statInfo = 1;
}

// ============================================================
// [CHAT] 
// ============================================================
message C_CHAT_REQ {
    string message = 1;
}

message S_CHAT_RES {
    bool success = 1; // 전송 성공 여부
}

message S_CHAT_NTF {
    uint64 playerId = 1;
    string message = 2;
}



// ============================================================
// [HEARTBEAT]
// ============================================================
message S_HEART_BEAT_RES { } 
message C_HEART_BEAT_REQ { }