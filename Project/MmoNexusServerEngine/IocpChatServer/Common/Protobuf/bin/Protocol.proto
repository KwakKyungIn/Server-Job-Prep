syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

// ============================================================
// [LOGIN SERVER 전용] 
// ============================================================

// 1. 로그인 요청 (Client -> LoginServer)
// 기존 C_LOGIN_REQ 대체
message C_LOGIN {
    string userId = 1;
    string password = 2; // (일단 평문)
}

// 2. 로그인 응답 (LoginServer -> Client)
// 기존 S_LOGIN_RES 대체
message S_LOGIN {
    bool success = 1;
    repeated ServerInfo serverList = 2; // 접속 가능한 게임 서버 목록
    string token = 3; // [핵심] 발급된 인증 토큰
}

// 3. 서버 정보 구조체
message ServerInfo {
    string name = 1; // "1채널"
    string ip = 2;   // "127.0.0.1"
    int32 port = 3;  // 7777
    int32 congestion = 4; // 혼잡도
}

// ============================================================
// [GAME SERVER 전용] 
// ============================================================

// 4. 게임 서버 입장 요청 (Client -> GameServer)
// 기존 C_ENTER_GAME_REQ 대체
// 더 이상 캐릭터 인덱스(PlayerIndex)를 보내지 않는다. (LoginServer에서 이미 결정했다고 가정하거나, 여기서 Token만 보냄)
message C_ENTER_GAME {
    string token    = 1; // [핵심] ID 대신 토큰
    int32  channelId = 2; // [NEW] 클라이언트에서 선택한 채널
    int32  mapId     = 3; // [NEW] 입장할 맵 (없으면 1로 사용해도 됨)
}
// 5. 입장 응답 (GameServer -> Client)
// 기존 S_ENTER_GAME_RES 대체
message S_ENTER_GAME {
    bool success = 1;
    PlayerInfo myPlayer = 2; // 내 캐릭터 정보
}

// ============================================================
// [GAME LOGIC - MOVEMENT] (그대로 유지)
// ============================================================
message C_MOVE {
    PositionInfo posInfo = 1; 
}

message S_MOVE {
    uint64 objectId = 1;
    PositionInfo posInfo = 2; 
}

// ============================================================
// [GAME LOGIC - VISIBILITY] (그대로 유지)
// ============================================================
message S_SPAWN {
    repeated PlayerInfo players = 1; 
    repeated MonsterInfo monsters = 2; 
}
message S_DESPAWN {
    repeated uint64 objectIds = 1; 
}

// ============================================================
// [COMBAT] (그대로 유지)
// ============================================================
message C_SKILL {
    int32 skillId = 1; 
}

message S_SKILL {
    uint64 objectId = 1; 
    int32 skillId = 2;   
}

message S_CHANGE_HP {
    uint64 objectId = 1; 
    uint64 attackerId = 2; 
    int32 currentHp = 3; 
    int32 damage = 4;    
}

// ============================================================
// [ITEM & INVENTORY] (그대로 유지)
// ============================================================
message S_ITEM_LIST {
    repeated ItemInfo items = 1;
}

message C_USE_ITEM {
    uint64 itemUid = 1;
}

message S_CHANGE_ITEM {
    ItemInfo item = 1; 
}

message S_REMOVE_ITEM {
    uint64 itemUid = 1;
}

message C_EQUIP_ITEM {
    uint64 itemUid = 1;      
    int32 slotIndex = 2;     
    bool equip = 3;          
}

message S_EQUIP_ITEM {
    uint64 itemUid = 1;
    bool equipped = 2;
    int32 slotIndex = 3; 
}

message S_CHANGE_STAT {
    StatInfo statInfo = 1;
}

// ============================================================
// [GAME SERVER 전용] 
// ============================================================
message C_MAP_CHANGE_REQ {
    int32 targetMapId = 1; 
}
message S_MAP_CHANGE_BEGIN {
    uint64 token = 1; int32 targetMapId = 2; PositionInfo spawn = 3; 
}

message C_MAP_CHANGE_ACK {
    uint64 token = 1; 
}
message S_MAP_CHANGE_END {
    uint64 token = 1; int32 mapId = 2; PositionInfo pos = 3; 
}




// ============================================================
// [CHAT] (그대로 유지)
// ============================================================
message C_CHAT_REQ {
    string message = 1;
}

message S_CHAT_RES {
    bool success = 1; 
}

message S_CHAT_NTF {
    uint64 playerId = 1;
    string name = 2;
    string message = 3;
}

// ============================================================
// [HEARTBEAT] (그대로 유지)
// ============================================================
message S_HEART_BEAT_RES { } 
message C_HEART_BEAT_REQ { }

message C_PARTY_CHAT_REQ {
    string message = 1;
}

message S_PARTY_CHAT_NTF {
    uint64 partyId = 1;
    uint64 senderId = 2;
    string senderName = 3;
    string message = 4;
}

message S_PARTY_INFO_NTF {
    bool hasParty = 1;
    uint64 partyId = 2;
    uint64 leaderId = 3;
    repeated uint64 memberIds = 4;
    uint32 version = 5;
}


// ============================================================
// [PARTY - CONTROL] (NEW)
// ============================================================

// 파티 생성/초대/수락/거절/탈퇴/추방/해산 요청들
// - op/reason enum은 Enum.proto에 정의할 것

message C_PARTY_CREATE_REQ {
    uint64 targetPlayerId = 1; // 처음 파티 시작: 상대 1명을 지정 (0이면 혼자 파티 생성도 가능)
}

message C_PARTY_INVITE_REQ {
    uint64 targetPlayerId = 1;
}

message C_PARTY_INVITE_ACCEPT_REQ {
    uint64 partyId = 1;   // 초대 받은 파티
    bool accept = 2;      // true=수락, false=거절
}

message C_PARTY_LEAVE_REQ { }

message C_PARTY_KICK_REQ {
    uint64 targetPlayerId = 1;
}

message C_PARTY_DISBAND_REQ { }

// 서버 -> 클라: 결과(공통)
// op/reason은 Enum.proto에서: PartyOp, PartyResultReason 같은 걸로 정의
message S_PARTY_RESULT {
    int32 op = 1;         // PartyOp (enum)
    bool success = 2;
    int32 reason = 3;     // PartyResultReason (enum)
    uint64 partyId = 4;
    uint32 version = 5;
}

// 서버 -> 클라: 파티 초대 알림
message S_PARTY_INVITE_NTF {
    uint64 partyId = 1;
    uint64 inviterId = 2;
    string inviterName = 3;
}

// ============================================================
// [PARTY - STATUS] (NEW) 파티원 체력/레벨 등 상태 확인
// ============================================================

// 파티원 상태(최소)
// - objectId까지 넣으면 월드에서 찾을 때도 편함(없으면 0)
message PartyMemberStatus {
    uint64 playerId = 1;
    uint64 objectId = 2;
    string name = 3;

    int32 level = 4;
    int32 hp = 5;
    int32 maxHp = 6;

    int32 mapId = 7;
    int32 channelId = 8;
    PositionInfo posInfo = 9; // 원하면 제거 가능(미니맵/추적용)
}

// 클라 -> 서버: 파티 상태 스냅샷 요청 (UI 열 때 1번)
message C_PARTY_STATUS_REQ { }

// 서버 -> 클라: 파티 상태 스냅샷/갱신
// - memberStatus는 전체 스냅샷을 보내도 되고, delta로 보내도 됨(일단 스냅샷부터)
message S_PARTY_STATUS_NTF {
    uint64 partyId = 1;
    uint32 version = 2;
    repeated PartyMemberStatus members = 3;
}
