syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

// [LOGIN]
message C_LOGIN_REQ {
    string name = 1;
}

message S_LOGIN_RES {
    bool success = 1;
    uint64 playerId = 2;
}

// [CHAT] 방 개념 없음. 그냥 쏘면 GameServer가 알아서 처리.
message C_CHAT_REQ {
    string message = 1;
}

message S_CHAT_RES {
    bool success = 1;
}

message S_CHAT_NTF {
    uint64 playerId = 1;
    string name = 2;
    string message = 3;
}