syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

// ============================================================
// [LOGIN]
// ============================================================
message C_LOGIN_REQ {
    string name = 1;
}

message S_LOGIN_RES {
    bool success = 1;
    uint64 playerId = 2;             // [Restore] 기존 코드 호환용 (메인 캐릭터 ID)
    repeated PlayerInfo players = 3; // [New] 계정에 생성된 캐릭터 목록 (캐릭터 선택창용)
}

message C_ENTER_GAME_REQ {
    uint64 playerIndex = 1; // 선택한 캐릭터 인덱스
}

message S_ENTER_GAME_RES {
    bool success = 1;
    PlayerInfo myPlayer = 2; // 내 캐릭터 정보 (좌표 포함)
}

// ============================================================
// [GAME LOGIC - MOVEMENT] (필수!)
// ============================================================
message C_MOVE {
    PositionInfo posInfo = 1; // 내가 이동한 좌표와 상태
}

message S_MOVE {
    uint64 playerId = 1;
    PositionInfo posInfo = 2; // 누가 어디로 갔는지
}

// ============================================================
// [GAME LOGIC - VISIBILITY] (Spawn/Despawn)
// ============================================================
message S_SPAWN {
    repeated PlayerInfo players = 1; // 내 시야에 들어온 플레이어들
}

message S_DESPAWN {
    repeated uint64 playerIds = 1; // 내 시야에서 사라진 플레이어들 (ID만)
}

// ============================================================
// [CHAT] 
// ============================================================
message C_CHAT_REQ {
    string message = 1;
}

message S_CHAT_RES {
    bool success = 1; // 전송 성공 여부
}

message S_CHAT_NTF {
    uint64 playerId = 1;
    string message = 2;
}

// ============================================================
// [HEARTBEAT]
// ============================================================
message S_HEART_BEAT_RES { } 
message C_HEART_BEAT_REQ { }