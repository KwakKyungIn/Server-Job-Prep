syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

// ============================================================
// [S2S] Common Logic
// ============================================================
// 서버 간 통신에서는 '누구의 요청인가'를 추적하는 Context가 생명이다.
// GameServer가 요청할 때 playerSessionId를 담아 보내고, 
// DB/Chat 서버는 이걸 그대로 돌려줘야 한다.

// ============================================================
// 1. DB Agent 통신 (Login & Data)
// ============================================================
message S2S_REQ_LOGIN {
    uint64 playerSessionId = 1; // [Context] 요청한 PlayerSession의 ID (GameServer 내부 ID)
    string name = 2;            // 계정 이름
}

message S2S_RES_LOGIN {
    bool success = 1;
    uint64 playerId = 2;        // DB에서 발급된 Player ID (UID)
    uint64 playerSessionId = 3; // [Context] 그대로 반환 -> 이걸로 GameServer가 PlayerSession 찾음
}



// ============================================================
// [PLAYER DATA LOADING] (NEW)
// ============================================================

// [REQ] GameServer -> DBAgent: "이 유저의 레벨, HP, Exp 내놔"
message S2S_REQ_LOAD_PLAYER_DATA {
    uint64 playerId = 1;
    uint64 gameSessionId = 2; // 왕복 티켓
}

// [RES] DBAgent -> GameServer: "찾아왔다"
message S2S_RES_LOAD_PLAYER_DATA {
    bool success = 1;
    uint64 playerId = 2;
    StatInfo statInfo = 3;    // DB에서 긁어온 스탯 정보
    uint64 gameSessionId = 4; // 왕복 티켓 반환
}



// [Item & Inventory]
message S2S_REQ_ITEMS_LOAD {
    uint64 playerId = 1;
    uint64 gameSessionId = 2; // 누구한테 답장해줄지 추적용
}

message S2S_RES_ITEMS_LOAD {
    uint64 playerId = 1;
    bool success = 2;
    repeated ItemInfo items = 3; // DB에서 긁어온 아이템 리스트
    uint64 gameSessionId = 4;
}

message S2S_REQ_LOAD_GAME_DATA {
    // 인자 없음
}

// [RES] DBAgent -> GameServer: "여기 있다"
message S2S_RES_LOAD_GAME_DATA {
    bool success = 1;
    // Struct.proto에 정의된 타입을 그대로 사용
    repeated StatTemplateInfo stats = 2; 
    repeated ItemTemplateInfo items = 3;
    repeated SkillTemplateInfo skills = 4;
}


// ============================================================
// 3. System (Heartbeat)
// ============================================================
message S2S_RES_HEART_BEAT { } 
message S2S_REQ_HEART_BEAT { }


