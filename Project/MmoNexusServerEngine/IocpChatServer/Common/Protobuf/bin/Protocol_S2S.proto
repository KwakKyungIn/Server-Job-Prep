syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

// ============================================================
// [S2S] Common Logic
// ============================================================
// 서버 간 통신에서는 '누구의 요청인가'를 추적하는 Context가 생명이다.
// GameServer가 요청할 때 playerSessionId를 담아 보내고, 
// DB/Chat 서버는 이걸 그대로 돌려줘야 한다.

// ============================================================
// 1. DB Agent 통신 (Login & Data)
// ============================================================
message S2S_REQ_LOGIN {
    uint64 playerSessionId = 1; // [Context] 요청한 PlayerSession의 ID (GameServer 내부 ID)
    string name = 2;            // 계정 이름
}

message S2S_RES_LOGIN {
    bool success = 1;
    uint64 playerId = 2;        // DB에서 발급된 Player ID (UID)
    uint64 playerSessionId = 3; // [Context] 그대로 반환 -> 이걸로 GameServer가 PlayerSession 찾음
}



// ============================================================
// [PLAYER DATA LOADING] (NEW)
// ============================================================

// [REQ] GameServer -> DBAgent: "이 유저의 레벨, HP, Exp 내놔"
message S2S_REQ_LOAD_PLAYER_DATA {
    uint64 playerId = 1;
    uint64 gameSessionId = 2; // 왕복 티켓
}

// [RES] DBAgent -> GameServer: "찾아왔다"
message S2S_RES_LOAD_PLAYER_DATA {
    bool success = 1;
    uint64 playerId = 2;
    StatInfo statInfo = 3;    // DB에서 긁어온 스탯 정보
    uint64 gameSessionId = 4; // 왕복 티켓 반환
    int64 gold = 5;
}



// [Item & Inventory]
message S2S_REQ_ITEMS_LOAD {
    uint64 playerId = 1;
    uint64 gameSessionId = 2; // 누구한테 답장해줄지 추적용
}

message S2S_RES_ITEMS_LOAD {
    uint64 playerId = 1;
    bool success = 2;
    repeated ItemInfo items = 3; // DB에서 긁어온 아이템 리스트
    uint64 gameSessionId = 4;
}

message S2S_REQ_LOAD_GAME_DATA {
    // 인자 없음
}

// [RES] DBAgent -> GameServer: "여기 있다"
message S2S_RES_LOAD_GAME_DATA {
    bool success = 1;
    // Struct.proto에 정의된 타입을 그대로 사용
    repeated StatTemplateInfo stats = 2; 
    repeated ItemTemplateInfo items = 3;
    repeated SkillTemplateInfo skills = 4;
}


// ============================================================
// 3. System (Heartbeat)
// ============================================================
message S2S_RES_HEART_BEAT { } 
message S2S_REQ_HEART_BEAT { }

// ============================================================
// [SAVE] Redis -> DB commit
// (AutoCommitService / FlushNow에서 쓰는 저장 요청)
// ============================================================

message S2S_REQ_SAVE_PLAYER_CORE {
    uint64 playerId = 1;
    int32 level = 2;
    int32 hp = 3;
    int64 totalExp = 4;
    int64 gold = 5;
}

message S2S_RES_SAVE_PLAYER_CORE {
    bool success = 1;
    uint64 playerId = 2;
}

message S2S_REQ_SAVE_INVENTORY {
    uint64 playerId = 1;
    repeated ItemInfo items = 2;          // 전체 스냅샷(인벤 24개라 OK)
    repeated uint64 deletedItemUids = 3;  // tombstone
}

message S2S_RES_SAVE_INVENTORY {
    bool success = 1;
    uint64 playerId = 2;
}

// ============================================================
// [CREATE ITEM] DB IDENTITY uid 발급
// ============================================================

message S2S_REQ_ITEM_CREATE {
    uint64 playerId = 1;
    int32 templateId = 2;
    int32 slotIndex = 3;
    int32 count = 4;
    bool isEquipped = 5;
    uint64 requestId = 6;
}

message S2S_RES_ITEM_CREATE {
    bool success = 1;
    uint64 playerId = 2;
    uint64 itemUid = 3;
    int32 templateId = 4;
    int32 slotIndex = 5;
    int32 count = 6;
    bool isEquipped = 7;
    uint64 requestId = 8;
}


message S2S_REQ_GAME_ITEM_UID_SEED {
  // 필요하면 serverId 같은 거 넣어도 되는데, 지금은 비워도 됨
}

message S2S_RES_GAME_ITEM_UID_SEED {
  bool success = 1;
  uint64 next_uid = 2; // DB에서 계산한 MAX(game_item_uid)+1
}

message S2S_REQ_QUICKSLOT_LOAD {
    uint64 playerId = 1;
    uint64 gameSessionId = 2;
}

message S2S_RES_QUICKSLOT_LOAD {
    bool success = 1;
    uint64 playerId = 2;
    uint64 gameSessionId = 3;
    repeated QuickSlotInfo slots = 4;
}

message S2S_REQ_SAVE_QUICKSLOT {
    uint64 playerId = 1;
    repeated QuickSlotInfo slots = 2; // 전체 스냅샷
}

message S2S_RES_SAVE_QUICKSLOT {
    bool success = 1;
    uint64 playerId = 2;
}

// ============================================================
// [TRADE] Atomic commit (Phase 2)
//  - DBAgent applies both players' inventory changes in a single SQL transaction.
//  - GameServer applies memory/redis only after success response.
// ============================================================

message S2S_REQ_TRADE_COMMIT {
    uint64 tradeId = 1;

    // Routing: which GameRoom should receive the response.
    int32 channelId = 2;
    int32 mapId = 3;
    int64 instanceId = 4;

    uint64 playerAId = 5;
    uint64 playerBId = 6;

    repeated ItemInfo finalAItems = 7;
    repeated uint64 deletedAItemUids = 8;

    repeated ItemInfo finalBItems = 9;
    repeated uint64 deletedBItemUids = 10;

    uint64 requestId = 11; // optional (debug/matching)

    int64 finalGoldA = 12;
    int64 finalGoldB = 13;
}

message S2S_RES_TRADE_COMMIT {
    uint64 tradeId = 1;

    // Routing echo
    int32 channelId = 2;
    int32 mapId = 3;
    int64 instanceId = 4;

    bool success = 5;
    TradeFailCode failCode = 6;

    uint64 requestId = 7; // echo
}